<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Terrain Walk</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb;
      font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
    #start { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
      background: rgba(20, 50, 80, 0.55); color: #fff; cursor: pointer; }
    #start > div { padding: 1.2em 1.6em; background: rgba(0,0,0,.35); border-radius: 12px; line-height: 1.5; }
    #start h1 { margin: 0 0 .3em; font-size: 1.6rem; }
    #stick { position: fixed; left: max(24px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom));
      width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6);
      background: rgba(255,255,255,.15); touch-action: none; display: none; }
    #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%;
      background: rgba(255,255,255,.7); }
    #hud { position: fixed; top: 8px; left: 10px; max-width: calc(100vw - 120px); color: #fff; font-size: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; }
    #cross { position: fixed; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none;
      filter: drop-shadow(0 0 2px rgba(0,0,0,.7)); z-index: 3; }
    #cross svg { width: 100%; height: 100%; display: block; }
    #fire { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: calc(max(24px, env(safe-area-inset-bottom)) + 100px); display: none;
      width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(255,90,80,.85); background: rgba(255,50,40,.28);
      color: #fff; font: bold 13px system-ui, sans-serif; touch-action: none; -webkit-tap-highlight-color: transparent; z-index: 2; }
    #jump { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: calc(max(24px, env(safe-area-inset-bottom)) + 8px); display: none;
      width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); background: rgba(255,255,255,.18);
      color: #fff; font: bold 13px system-ui, sans-serif; touch-action: none; -webkit-tap-highlight-color: transparent; z-index: 2; }
    #hit { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 4;
      background: radial-gradient(ellipse at center, rgba(255,40,30,0) 35%, rgba(255,30,20,.75) 100%); }
    #dead { position: fixed; inset: 0; display: none; place-items: center; text-align: center; z-index: 5; color: #fff; cursor: pointer;
      animation: deadflash 0.9s steps(1, end) infinite; }
    #dead.on { display: grid; }
    #dead div { font: bold clamp(1.3rem, 7.5vw, 2.4rem) system-ui, sans-serif; padding: 0 12px; text-shadow: 0 2px 8px #000; letter-spacing: .08em; }
    #dead small { display: block; margin-top: .6em; font-size: .9rem; font-weight: 600; letter-spacing: .02em; opacity: .9; }
    @keyframes deadflash {
      0% { background: rgba(255, 20, 20, .70); } 15% { background: rgba(130, 0, 0, .78); } 30% { background: rgba(255, 90, 90, .62); }
      45% { background: rgba(80, 0, 0, .82); } 60% { background: rgba(230, 0, 20, .72); } 75% { background: rgba(170, 20, 10, .75); }
      90% { background: rgba(255, 60, 40, .66); }
    }
    #new { z-index: 6; position: fixed; top: 8px; right: 10px; padding: 6px 10px; border-radius: 8px; border: 0;
      background: rgba(0,0,0,.4); color: #fff; font-size: 13px; }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="start"><div>
    <h1>Terrain Walk</h1>
    <div>Tap to start<br><small>Phone: left stick to move, drag right side to look<br>
    Desktop: WASD / arrows + mouse (click to capture), Shift to run</small></div>
  </div></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="cross"><svg viewBox="0 0 46 46" fill="none" stroke="#ff2a22" stroke-width="2.4" stroke-linecap="round">
    <circle cx="23" cy="23" r="12.5"/><circle cx="23" cy="23" r="1.9" fill="#ff2a22" stroke="none"/>
    <path d="M23 2v13M23 31v13M2 23h13M31 23h13"/></svg></div>
  <div id="hud"></div>
  <div id="hit"></div>
  <div id="dead"><div>MECH DESTROYED<small>tap or press R to redeploy</small></div></div>
  <button id="new">New map</button>
  <button id="fire">FIRE</button>
  <button id="jump">JUMP</button>
  <script type="module" src="./main.js"></script>
</body>
</html>
